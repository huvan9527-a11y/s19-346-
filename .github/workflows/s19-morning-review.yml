name: S19 上午回顾
on:
  workflow_dispatch:
    inputs:
      review_date:
        description: '回顾日期 YYYY-MM-DD；留空为北京时间今天'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3'
      - name: 回顾上午扫描与推送
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DATE: ${{ inputs.review_date }}
        run: python src/morning_review.py --date "$REVIEW_DATE"
      - name: 下载回顾报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-review-${{ github.run_id }}
          path: outputs/morning_review/
          retention-days: 30
