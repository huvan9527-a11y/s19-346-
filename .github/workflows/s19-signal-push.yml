name: S19 旧独立推送入口（已合并）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Unified workflow information
        run: |
          echo '独立推送已停用，避免与模拟仓使用不同候选池或重复推送。'
          echo '请运行 S19 统一实时模拟与推送（s19-paper.yml）。'
          echo '本入口不扫描、不通知、不修改账户。' >> "$GITHUB_STEP_SUMMARY"
