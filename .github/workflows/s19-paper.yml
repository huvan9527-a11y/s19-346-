name: S19 20万模拟仓

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；北京时间 09:40 = UTC 01:40。
    # 只负责“启动一次”，启动后程序常驻到 10:57，每15秒扫描。
    - cron: '40 1 * * 1-5'

permissions:
  contents: write

concurrency:
  group: s19-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run S19 continuously
        env:
          TZ: Asia/Shanghai
          S19_SCAN_INTERVAL_SECONDS: '15'
        run: python src/run_continuous.py

      - name: Persist paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state logs outputs
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "paper: update S19 simulated account"
            git push
          fi
