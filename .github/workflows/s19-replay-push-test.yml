name: S19 双轨推送测试

on:
  workflow_dispatch:

jobs:
  replay-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Test strict and broad ServerChan alerts
        env:
          TZ: Asia/Shanghai
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python src/replay_push_test.py
